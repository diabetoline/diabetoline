name: Catalog diabetoline.com
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/catalog
          for p in 1 2 3; do curl -sS "https://diabetoline.com/products.json?limit=250&page=$p" -o data/catalog/products-$p.json; done
          curl -sS "https://diabetoline.com/collections.json?limit=250" -o data/catalog/collections.json
          git config user.name "catalog-bot"; git config user.email "noreply@diabetoline.com"
          git add data/catalog && git commit -m "Catalog diabetoline.com ($(date -u +%F))" || echo "nimic nou"
          git push
