name: Catalog diabetoline.com
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/catalog
          for p in 1 2 3; do curl -sS "https://diabetoline.com/products.json?limit=250&page=$p" -o data/catalog/products-$p.json; done
          curl -sS "https://diabetoline.com/collections.json?limit=250" -o data/catalog/collections.json
          curl -sS "https://api.frankfurter.dev/v1/latest?base=RON&symbols=EUR,USD,GBP,CHF,PLN,HUF,CZK,SEK,DKK,NOK,BGN,MDL" -L -o data/catalog/rates.json || curl -sSL "https://api.frankfurter.app/latest?from=RON&to=EUR,USD,GBP,CHF,PLN,HUF,CZK,SEK,DKK,NOK,BGN,MDL" -o data/catalog/rates.json || true
          python3 scripts/catalog.py
          git config user.name "catalog-bot"; git config user.email "noreply@diabetoline.com"
          git add data/catalog src/catalog.json src/rates.json && git commit -m "Catalog diabetoline.com ($(date -u +%F))" || echo "nimic nou"
          git push
