name: EAS env (setează o variabilă)
# Pornire manuală: pune/actualizează o variabilă în mediul EAS ales (de ex. FB_APP_ID pentru SDK-ul Meta).
# Valoarea apare în inputs-urile rulării (repo privat); pentru chei cu adevărat secrete folosește vizibilitatea „secret”
# și pune-le direct pe expo.dev → Environment variables.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Numele variabilei (ex. FB_APP_ID)"
        required: true
        type: string
      value:
        description: "Valoarea"
        required: true
        type: string
      environment:
        description: "Mediul EAS"
        default: production
        type: choice
        options: [production, preview]
      visibility:
        description: "plaintext = vizibilă și în config (necesar pentru pluginuri la build) · sensitive = ascunsă în UI"
        default: plaintext
        type: choice
        options: [plaintext, sensitive, secret]
jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: |
          eas env:create ${{ inputs.environment }} --name "${{ inputs.name }}" --value "${{ inputs.value }}" --type string --visibility ${{ inputs.visibility }} --scope project --non-interactive --force
          eas env:list ${{ inputs.environment }} --non-interactive | grep -i "${{ inputs.name }}" || true
