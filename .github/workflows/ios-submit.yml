name: Trimite în TestFlight (ultimul build iOS)
# Pornire manuală: ia ultimul build iOS reușit de pe EAS și îl trimite în TestFlight, fără să recompileze.
on:
  workflow_dispatch:
env:
  EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc-key.p8
  EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Cheia App Store Connect
        run: printf '%s\n' "$ASC_API_KEY" > "$EXPO_ASC_API_KEY_PATH"
        env: { ASC_API_KEY: "${{ secrets.ASC_API_KEY }}" }
      - name: TestFlight
        run: |
          jq --arg p "$EXPO_ASC_API_KEY_PATH" --arg i "$EXPO_ASC_ISSUER_ID" --arg k "$EXPO_ASC_KEY_ID" \
            '.submit.production.ios += {ascApiKeyPath: $p, ascApiKeyIssuerId: $i, ascApiKeyId: $k}' eas.json > eas.tmp && mv eas.tmp eas.json
          eas submit --platform ios --latest --non-interactive
