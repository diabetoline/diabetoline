name: Build iOS (TestFlight / App Store)
# Pornire manuală. Certificatele și profilul de provizionare sunt ținute de EAS (credentialsSource: remote):
# prima dată se generează pe expo.dev → proiect → Credentials → iOS, cu o cheie App Store Connect API (Alex o încarcă acolo, nu în repo).
# Rezultatul: un .ipa; cu „submit = true” e trimis automat în TestFlight (are nevoie de aceeași cheie ASC salvată în EAS Submit).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "production = App Store/TestFlight · preview = instalare ad-hoc"
        default: production
        type: choice
        options: [production, preview]
      submit:
        description: "Trimite în TestFlight după build"
        default: true
        type: boolean
env:
  EXPO_PUBLIC_API_URL: https://curalife.expo.app
  EXPO_PUBLIC_BUILD: ${{ github.sha }}
  # Cheia App Store Connect API (secretele GitHub ASC_*): EAS generează singur certificatul, profilul și cheia de push,
  # și trimite în TestFlight. Cheia nu e în repo.
  EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc-key.p8
  EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  EXPO_APPLE_TEAM_ID: ZPGCFQ3TK5
  EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Cheia App Store Connect
        run: printf '%s\n' "$ASC_API_KEY" > "$EXPO_ASC_API_KEY_PATH"
        env: { ASC_API_KEY: "${{ secrets.ASC_API_KEY }}" }
      - name: Codul de versiune în aplicație
        run: |
          echo "{ \"sha\": \"${{ github.sha }}\" }" > src/build.json
      - name: Build .ipa pe EAS
        # Prima dată EAS trebuie să creeze certificatul, profilul și cheia de push; în modul --non-interactive refuză.
        # Rulăm interactiv și răspundem cu Enter (toate propunerile sunt „da, generează”), cu cheia ASC din variabile.
        run: |
          sudo apt-get install -y -qq expect > /dev/null
          expect <<'EXP'
          set timeout -1
          spawn env -u CI -u GITHUB_ACTIONS -u CONTINUOUS_INTEGRATION -u BUILD_NUMBER -u RUN_ID EAS_BUILD_NO_EXPO_GO_WARNING=true eas build --platform ios --profile ${{ inputs.profile || 'production' }}
          expect {
            -re {\(Y/n\)|\(y/N\)} { send "\r"; exp_continue }
            -re {›\s*$} { send "\r"; exp_continue }
            eof
          }
          lassign [wait] pid spawnid os_error exit_code
          exit $exit_code
          EXP
          eas build:list --platform ios --limit 1 --json --non-interactive > build.json
      - name: Motivul erorii (dacă a picat)
        if: failure()
        run: eas build:list --platform ios --limit 1 --json --non-interactive | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const a=JSON.parse(d);const b=Array.isArray(a)?a[0]:a;if(!b){console.log("fără build pe EAS");return}console.log(b.status, b.error||"", b.logFiles||"", b.buildDetailsPageUrl||"")})'
      - name: Linkul de descărcare
        run: |
          echo "## Fișierul (${{ inputs.profile || 'production' }})" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const b=require("./build.json");const x=Array.isArray(b)?b[0]:b;console.log(x.artifacts?.buildUrl||x.artifacts?.applicationArchiveUrl||JSON.stringify(x))' >> "$GITHUB_STEP_SUMMARY"
      - name: TestFlight
        if: ${{ inputs.submit && (inputs.profile || 'production') == 'production' }}
        run: eas submit --platform ios --latest --non-interactive
