name: Alerte de inactivitate + raport zilnic
# O dată pe zi: (1) părinții inactivi → alertă la copil; (2) raportul de utilizare pe email către Alex (/api/watch, migrarea 0009).
on:
  schedule:
    - cron: "0 17 * * *"   # 19:00 ora României (iarna)
  workflow_dispatch:
jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS -X POST https://curalife.expo.app/api/nudge
      - run: curl -sS -X POST https://curalife.expo.app/api/watch
      - run: curl -sS -X POST https://curalife.expo.app/api/reorder
