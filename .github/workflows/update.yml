name: Publică (server + Expo Go)
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # adresa serverului (EAS Hosting); aplicația o citește prin EXPO_PUBLIC_API_URL
  EXPO_PUBLIC_API_URL: https://curalife.expo.app
  EXPO_PUBLIC_BUILD: ${{ github.sha }}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Server → EAS Hosting (rutele /api)
        run: |
          npx expo export --platform web
          eas deploy --prod --environment production --non-interactive
      - name: Test de fum pe server
        run: pip install -q pillow && bash scripts/smoke.sh https://curalife.expo.app
      - name: Aplicația → Expo Go (ramura preview)
        run: |
          eas update --branch production --platform all --non-interactive --message "${{ github.sha }}"
          eas update --branch preview --platform all --non-interactive --message "${{ github.sha }}"
