name: Publică actualizare (Expo Go)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - name: Publică pe ramura preview (Expo Go)
        run: eas update --branch preview --platform all --non-interactive --message "${{ github.sha }}"
